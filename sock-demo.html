<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Démo chaussette 3D — référence</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html, body { margin: 0; height: 100%; background: #ecebe8; font-family: system-ui, sans-serif; }
      #v { position: fixed; inset: 0; }
      #bar { position: fixed; left: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
      #bar .rg { background:#fff; padding:6px 10px; border-radius:6px; border:1px solid #ccc; font-size:13px; }
      #bar button, #bar select { font: inherit; padding: 6px 10px; border: 1px solid #ccc; background: #fff; border-radius: 6px; cursor: pointer; }
    </style>
  </head>
  <body>
    <div id="v"></div>
    <div id="bar">
      <select id="size"><option value="homme">Homme</option><option value="femme">Femme</option></select>
      <select id="tile">
        <option value="carreau-test-etoile.svg">Étoile</option>
        <option value="carreau-test-quart.svg">Quart de cercle</option>
        <option value="carreau-test-damier.png">Damier</option>
      </select>
      <select id="coll"><option value="">Collection : (carreaux d'exemple)</option></select>
      <select id="pal"></select>
      <select id="calep">
        <option value="">Calepinage : 1 carreau, quinconce</option>
        <option value="g-suite">3 carreaux à la suite</option>
        <option value="g-suite-rot90">3 carreaux, +90° à chaque carreau</option>
        <option value="g-suite-rotalea">3 carreaux, rotation aléatoire</option>
        <option value="g-alea-voisins">3 carreaux aléatoires sans voisins</option>
        <option value="p:rosace">Préréglage « Rosace » (quart de cercle)</option>
        <option value="p:ophis_tressage_4x4">Préréglage « Ophis Tressage »</option>
      </select>
      <label style="background:#fff;padding:6px 10px;border-radius:6px;border:1px solid #ccc"><input type="checkbox" id="cuff" checked /> bord-côte</label>
      <label class="rg">Talon hauteur <input type="range" id="heelH" min="25" max="110" value="55" /> <span id="heelHv">55</span> mm</label>
      <label class="rg">profondeur <input type="range" id="heelD" min="40" max="130" value="72" /> <span id="heelDv">72</span> mm</label>
      <label class="rg">largeur <input type="range" id="heelS" min="50" max="100" value="100" /> <span id="heelSv">100</span> %</label>
      <button data-view="trois-quarts">3/4</button>
      <button data-view="profil-exterieur">Profil ext.</button>
      <button data-view="face">Face</button>
      <button data-view="dos">Dos</button>
      <button data-view="profil-interieur">Profil int.</button>
    </div>
    <script type="module" src="/reference/sock3d/demo.ts"></script>
  </body>
</html>
